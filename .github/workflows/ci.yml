name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Unit checks, minimal-container smoke test, real installations, offline ensure
        run: make integration
      - name: Playwright CLI and browser scripts as a normal user
        run: make playwright-integration
